<div style="min-height:100vh;display:flex;background:radial-gradient(ellipse 80% 60% at 50% -10%, hsl(43 90% 50% / 0.12), transparent 60%), hsl(0 0% 4%);position:relative;overflow:hidden;">

  <div style="position:absolute;inset:0;pointer-events:none;opacity:0.03;background-image:url(data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E);"></div>

  <!-- LEFT PANEL -->
  <div class="cascade-1"
       style="width:45%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 48px;border-right:1px solid hsl(43 30% 16%);position:relative;overflow:hidden;">

    <canvas #particlesCanvas style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
    <div style="position:absolute;top:-100px;left:-100px;width:400px;height:400px;border-radius:50%;background:var(--gradient-radial-gold);pointer-events:none;"></div>

    <div style="position:relative;z-index:1;text-align:center;width:100%;max-width:320px;">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--gradient-gold);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:hsl(0 0% 5%);margin:0 auto 24px;box-shadow:var(--shadow-gold-lg);animation:pulse-gold 2.5s ease-in-out infinite;">
        &#x20BF;
      </div>

      <div style="font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:0.2em;background:var(--gradient-text-gold);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;margin-bottom:4px;">
        Aurum Vault
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:hsl(var(--muted-foreground));letter-spacing:0.15em;text-transform:uppercase;margin-bottom:48px;">
        Bitcoin TestNet · Sovereign
      </div>

      <div style="width:100%;">
        <div *ngFor="let f of features"
             style="padding:12px 0 12px 16px;border-bottom:1px solid hsl(var(--border) / 0.5);border-left:2px solid hsl(43 74% 52% / 0.3);margin-bottom:4px;font-size:13px;color:hsl(var(--muted-foreground));text-align:left;">
          {{ f }}
        </div>
      </div>


    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="cascade-2"
       style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 80px;">

    <!-- STEP 1: credentials -->
    <div *ngIf="step === 'credentials'">
      <h1 class="display" style="font-size:36px;font-weight:700;background:var(--gradient-text-gold);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px;">
        Welcome Back
      </h1>
      <p style="font-size:14px;color:hsl(var(--muted-foreground));margin-bottom:40px;font-family:'JetBrains Mono',monospace;letter-spacing:0.05em;">
        Sign in to your vault
      </p>

      <div style="display:flex;border-bottom:1px solid hsl(var(--border));margin-bottom:36px;">
        <button style="padding:12px 24px;font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:0.08em;text-transform:uppercase;color:hsl(43 74% 52%);border-bottom:2px solid hsl(43 74% 52%);background:transparent;border-top:none;border-left:none;border-right:none;cursor:pointer;margin-bottom:-1px;">
          Sign In
        </button>
        <button (click)="goToRegister()" style="padding:12px 24px;font-size:13px;font-family:'JetBrains Mono',monospace;letter-spacing:0.08em;text-transform:uppercase;color:hsl(var(--muted-foreground));background:transparent;border:none;cursor:pointer;transition:color 0.2s;">
          Create Account
        </button>
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:hsl(var(--muted-foreground));margin-bottom:8px;">Username</label>
        <input type="text" class="input-field" [(ngModel)]="username" placeholder="Enter your username" [disabled]="isLoading" />
      </div>

      <div style="margin-bottom:28px;">
        <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:hsl(var(--muted-foreground));margin-bottom:8px;">Password</label>
        <input type="password" class="input-field" [(ngModel)]="password" placeholder="••••••••" [disabled]="isLoading" (keyup.enter)="login()" />
      </div>

      <button class="btn-gold" style="width:100%;padding:15px;font-size:15px;font-family:'Cinzel',serif;letter-spacing:0.08em;" (click)="login()" [disabled]="isLoading">
        {{ isLoading ? 'Authenticating...' : 'Enter the Vault' }}
      </button>

      <div *ngIf="message" style="margin-top:16px;padding:12px 16px;border:1px solid hsl(0 75% 55% / 0.3);border-radius:8px;background:hsl(0 75% 55% / 0.1);color:hsl(var(--destructive));font-size:13px;text-align:center;font-family:'JetBrains Mono',monospace;">
        {{ message }}
      </div>

      <div style="margin-top:48px;font-family:'JetBrains Mono',monospace;font-size:10px;color:hsl(var(--muted-foreground));display:flex;gap:12px;justify-content:center;letter-spacing:0.05em;text-transform:uppercase;">
        <span>AES-256</span><span>·</span><span>JWT Secured</span><span>·</span><span>ECDSA</span>
      </div>
    </div>

    <!-- STEP 2: TOTP -->
    <div *ngIf="step === 'totp'">
      <div style="width:64px;height:64px;border-radius:50%;border:1.5px solid hsl(43 74% 52%);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:24px;box-shadow:var(--shadow-gold);animation:pulse-gold 2.5s ease-in-out infinite;">
        &#128274;
      </div>
      <h1 class="display" style="font-size:28px;font-weight:700;background:var(--gradient-text-gold);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px;">
        Two-Factor Auth
      </h1>
      <p style="font-size:13px;color:hsl(var(--muted-foreground));margin-bottom:28px;font-family:'JetBrains Mono',monospace;">
        Enter the 6-digit code from Google Authenticator
      </p>

      <div style="padding:12px 16px;border:1px solid hsl(43 74% 52% / 0.3);border-left:2px solid hsl(43 74% 52%);border-radius:0 8px 8px 0;background:hsl(43 74% 52% / 0.05);margin-bottom:24px;font-size:12px;color:hsl(var(--muted-foreground));font-family:'JetBrains Mono',monospace;">
        Signing in as <strong style="color:hsl(43 74% 52%);">{{ username }}</strong>
      </div>

      <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:hsl(var(--muted-foreground));margin-bottom:8px;">Auth Code</label>
      <input type="text" class="input-field"
             style="font-family:'JetBrains Mono',monospace;font-size:28px;letter-spacing:16px;text-align:center;margin-bottom:24px;"
             [(ngModel)]="totpCode" placeholder="000000" maxlength="6" [disabled]="isLoading" (keyup.enter)="verifyTotp()" autofocus />

      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn-gold" style="width:100%;padding:14px;font-size:14px;font-family:'Cinzel',serif;letter-spacing:0.08em;" (click)="verifyTotp()" [disabled]="isLoading">
          {{ isLoading ? 'Verifying...' : 'Verify &amp; Enter' }}
        </button>
        <button class="btn-ghost" style="width:100%;padding:12px;" (click)="backToCredentials()" [disabled]="isLoading">
          &larr; Back to login
        </button>
      </div>

      <div *ngIf="message" style="margin-top:16px;padding:12px 16px;border:1px solid hsl(0 75% 55% / 0.3);border-radius:8px;background:hsl(0 75% 55% / 0.1);color:hsl(var(--destructive));font-size:13px;text-align:center;font-family:'JetBrains Mono',monospace;">
        {{ message }}
      </div>
    </div>
  </div>
</div>
